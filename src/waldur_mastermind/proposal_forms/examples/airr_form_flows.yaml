# The AIRR Gateway (airr-gw) and Rapid Access (airr-ra) application forms:
# the extra forms an applicant fills in besides Waldur's own proposal form.
#
# The survey ids are those of a development Formbricks instance: every
# Formbricks environment has its own, so change them to the target
# instance's (GET /api/formbricks-surveys/ lists them) before importing:
#
#   waldur import_form_flows airr_form_flows.yaml --dry-run
#
# then make the surveys ready with POST /api/form-flows/{uuid}/sync/ (or the
# Sync button), after checking what it will change with
# GET /api/form-flows/{uuid}/check/.
flows:
  - key: airr-gw
    name: AIRR Gateway application
    description: Team, compliance and the Gateway assessment questions.
    steps:
      - key: project_details
        label: More project details
        survey_id: jcruqg4z36qke3hjnwcjtizi
        reviewer_visible: true
      - key: team_details
        label: Team details
        survey_id: b1gyvodlr0kkybpk6xhjgh8w
      - key: compliance
        label: Compliance
        survey_id: ope97ipn9deow44v0icbkgtl
      - key: assessment
        label: Assessment questions
        survey_id: a49z3pligq7ybuypkaz52br1
        reviewer_visible: true
  - key: airr-ra
    name: AIRR Rapid Access application
    description: Team, compliance and the Rapid Access assessment questions.
